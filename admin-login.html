<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal | Farmville Resort</title>
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/bootstrap_reponsive.css">
</head><body>
<div class="auth-bg"></div><div class="auth-overlay"></div>
<div class="auth-card">
  <form id="admin-form" novalidate>
    <img class="auth-logo" src="images/farmville-logo.png" alt="Farmville Resort" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='https://www.figma.com/api/mcp/asset/ea27233b-f1a7-4e89-8957-a33591cc48cc/9fd63.png'}else{var d=document.createElement('div');d.className='logo-text';d.innerHTML='FARMVILLE<span>RESORT</span>';this.replaceWith(d)}">
    <div class="portal-tag">Admin Portal</div>
    <div class="fields">
      <div class="field" id="f-a-user"><label for="a-user">Username</label><input id="a-user" type="text" placeholder="Enter your admin username" autocomplete="username"><span class="err-msg"></span></div>
      <div class="field" id="f-a-pass">
        <label for="a-pass">Password</label>
        <div class="input-wrap">
          <input id="a-pass" type="password" placeholder="••••••••••••" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-for="a-pass" aria-label="Show password" title="Show password">🔒</button>
        </div>
        <span class="err-msg"></span>
      </div>
    </div>
    <p class="form-msg" id="admin-msg"></p>
    <div class="actions">
      <button class="btn-main" type="submit">Sign In</button>
    </div>
    <hr>
    <a class="admin-link" href="login.html">Back to Guest Login</a>
  </form>
</div>
<script src="js/auth.js"></script>
</body></html>
